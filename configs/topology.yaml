# Network Topology Configuration
# Defines routers, hosts, and directed interconnecting links with capacities and propagation latencies.

nodes:
  h1:
    type: host
    ip: "10.0.0.1"
  h2:
    type: host
    ip: "10.0.0.2"
  r1:
    type: router
  r2:
    type: router
  r3:
    type: router
  r4:
    type: router

links:
  # Host h1 connections
  - src: h1
    dst: r1
    capacity: 1000   # Mbps (1 Gbps)
    latency: 50      # microseconds
    max_queue_packets: 1000

  - src: r1
    dst: h1
    capacity: 1000
    latency: 50
    max_queue_packets: 1000

  # Path A: r1 -> r2 -> r4 (Primary high bandwidth path)
  - src: r1
    dst: r2
    capacity: 200    # Mbps (Bottleneck link under heavy traffic)
    latency: 100
    max_queue_packets: 200

  - src: r2
    dst: r4
    capacity: 200
    latency: 100
    max_queue_packets: 200

  # Path B: r1 -> r3 -> r4 (Alternative backup path)
  - src: r1
    dst: r3
    capacity: 150    # Mbps
    latency: 150
    max_queue_packets: 200

  - src: r3
    dst: r4
    capacity: 150
    latency: 150
    max_queue_packets: 200

  # Host h2 connections
  - src: r4
    dst: h2
    capacity: 1000
    latency: 50
    max_queue_packets: 1000

  - src: h2
    dst: r4
    capacity: 1000
    latency: 50
    max_queue_packets: 1000
